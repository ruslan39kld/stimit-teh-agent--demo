        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

        0%, 100% {
          left: 8%;
        }
        50% {
          left: 88%;
        }
      }

        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.035);
        }
      }

      @keyframes stimitDotBounce {
        0%, 100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      }

      .animate-coach-in {
        animation: stimitCoachIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .animate-signal-travel {
        animation: stimitSignalTravel 2.6s ease-in-out infinite;
      }

      .animate-node-pulse-1 {
        animation: stimitNodePulse 2.6s ease-in-out infinite 0s;
      }

      .animate-node-pulse-2 {
        animation: stimitNodePulse 2.6s ease-in-out infinite 0.85s;
      }

        animation: stimitNodePulse 2.6s ease-in-out infinite 1.7s;

        animation: stimitDotBounce 0.7s ease-in-out infinite 0s;
      }

        animation: stimitDotBounce 0.7s ease-in-out infinite 0.15s;
      }

        animation: stimitDotBounce 0.7s ease-in-out infinite 0.3s;
      }

          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;

        let sharedAudioCtx = null;

        function getAudioContext() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!sharedAudioCtx) {
            sharedAudioCtx = new AudioCtx();
          }
          if (sharedAudioCtx.state === 'suspended') {
            sharedAudioCtx.resume().catch(function () {});
          }
          return sharedAudioCtx;
        }

        function playSupportPing() {
          const ctx = getAudioContext();
          if (!ctx) return;
          try {
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.045, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
          } catch (e) {}
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')

            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        function classifyEmotion(emotionText) {
          const lower = (emotionText || '').toLowerCase();
          if (/раздраж|злост|гнев|паник|сопротивлен|негатив|нетерпен|острая/.test(lower)) {
            return { level: 'angry', shortLabel: 'Раздражён' };
          }
          if (
            /тревог|беспокой|растерян|неуверен|опасени|осторож|насторож|напряж|разочарован|усталост|страх/.test(
              lower
            )
          ) {
            return { level: 'anxious', shortLabel: 'Тревожится' };
          }
          return { level: 'calm', shortLabel: 'Спокоен / доволен' };
        }

        function renderHighlightedJsonHtml(data) {
          const formatted = JSON.stringify(data, null, 2);
          const lines = formatted.split('\n');
          return lines
            .map(function (line) {
              const m = line.match(/^(\s*)"([^"]+)"(\s*:\s*)(.*)$/);
              if (m) {
                return `<div class="leading-relaxed"><span>${escapeHtml(
                  m[1]
                )}</span><span class="text-sky-300">"${escapeHtml(
                  m[2]
                )}"</span><span class="text-slate-400">${escapeHtml(
                  m[3]
                )}</span>${highlightJsonValue(m[4])}</div>`;
              }
              return `<div class="leading-relaxed">${highlightJsonValue(line)}</div>`;
            })
            .join('');
        }

        function highlightJsonValue(valueToken) {
          const trimmed = valueToken.trim();
          const trailingComma = trimmed.endsWith(',') ? ',' : '';
          const core = trailingComma ? trimmed.slice(0, -1) : trimmed;
          const idx = valueToken.indexOf(trimmed);
          const leadingSpace = idx > 0 ? valueToken.slice(0, idx) : '';

          if (core.startsWith('"') && core.endsWith('"')) {
            return `<span>${escapeHtml(
              leadingSpace
            )}</span><span class="text-emerald-300">${escapeHtml(core)}</span>${
              trailingComma ? '<span class="text-slate-400">,</span>' : ''
            }`;
          }
          if (/^-?\d+(\.\d+)?$/.test(core)) {
            return `<span>${escapeHtml(
              leadingSpace
            )}</span><span class="text-amber-300">${escapeHtml(core)}</span>${
              trailingComma ? '<span class="text-slate-400">,</span>' : ''
            }`;
          }
          if (core === 'true' || core === 'false' || core === 'null') {
            return `<span>${escapeHtml(
              leadingSpace
            )}</span><span class="text-indigo-300">${escapeHtml(core)}</span>${
              trailingComma ? '<span class="text-slate-400">,</span>' : ''
            }`;
          }
          return `<span class="text-slate-300">${escapeHtml(valueToken)}</span>`;
        }

          const isProfilerActive = phase === 'profiler';
          const isProfilerDone =
            phase === 'router' || phase === 'final_agent' || phase === 'typing' || phase === 'idle';

          const isRouterActive = phase === 'router';
          const isRouterDone =
            phase === 'final_agent' || phase === 'typing' || phase === 'idle';

          const isFinalActive = phase === 'final_agent' || phase === 'typing';
          const isFinalDone = phase === 'idle';

          const statusText = getPhaseLabel(phase, isLastStep);

        function updateScenarioRegions(opts) {
          const o = opts || {};
          const controlsEl = document.getElementById('scenario-controls-bar');
          if (controlsEl) controlsEl.innerHTML = renderScenarioControlsBarHtml();

          const headerEl = document.getElementById('chat-header-box');
          if (headerEl) headerEl.innerHTML = renderChatHeaderHtml();

          const pipeEl = document.getElementById('pipeline-diagram-slot');
          if (pipeEl) pipeEl.innerHTML = renderPipelineHtml();

          const inspectorEl = document.getElementById('agents-inspector-slot');
          if (inspectorEl) inspectorEl.innerHTML = renderAgentsInspectorHtml();

          if (o.appendMessage) {
            const listEl = document.getElementById('chat-messages-list');
            if (listEl) {
              listEl.insertAdjacentHTML('beforeend', renderSingleMessageHtml(o.appendMessage));
            }
          }

          const indicatorEl = document.getElementById('chat-indicator-slot');
          if (indicatorEl) indicatorEl.innerHTML = renderChatIndicatorHtml();

          if (o.updateReplyDock !== false) {
            const dockEl = document.getElementById('chat-reply-dock');
            if (dockEl) dockEl.innerHTML = renderReplyOptionsHtml();
          }

          const anchor = document.getElementById('chat-scroll-anchor');
          if (anchor) {
            anchor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }

        function renderEvaluationView() {
          const scenario = getActiveScenario();
          const criteria = scenario.evaluation.criteria;
          const finalResult = scenario.evaluation.final_result;
          const altBranchesTotal = scenario.steps.reduce(function (sum, s) {
            return (
              sum +
              s.client_options.filter(function (o) {
                return !o.is_main;
              }).length
            );
          }, 0);

          const strengthsHtml = finalResult.main_strengths
            .map(function (item) {
              return `<li class="flex items-start gap-2 text-sm text-slate-700">${svgIcon(

                'mt-0.5 h-4 w-4 shrink-0 text-[#16A34A]'

            .join('');

          const weaknessesHtml = finalResult.main_weaknesses
            .map(function (item) {
              return `<li class="flex items-start gap-2 text-sm text-slate-700">${svgIcon(
                'alertCircle',
                'mt-0.5 h-4 w-4 shrink-0 text-[#D97706]'

            })
            .join('');

          const criteriaHtml = CRITERION_LABELS.map(function (item, idx) {
            const data = criteria[item.key];
            const pct = Math.min(100, Math.max(0, (data.score / 10) * 100));
            return `
              <div

                      scenario.industry

                    <div class="mt-6 grid grid-cols-1 gap-5 border-t border-slate-200 pt-5 sm:grid-cols-2">
                      <div>
                        <h2 class="font-display text-sm font-bold text-slate-900">Сильные стороны</h2>
                        <ul class="mt-2.5 space-y-2">${strengthsHtml}</ul>
                      </div>
                      <div>
                        <h2 class="font-display text-sm font-bold text-slate-900">Что улучшить</h2>
                        <ul class="mt-2.5 space-y-2">${weaknessesHtml}</ul>
                      </div>
                    </div>
                  </div>
                </div>
              </section>

              <section aria-label="Детальные критерии оценки" class="mt-8">
                <div class="mb-4 flex items-baseline justify-between">
                  <h2 class="font-display text-lg font-bold text-slate-900">Разбор по 7 критериям</h2>
                  <span class="font-mono-tabular text-xs font-medium text-slate-500">Шкала 1–10</span>
                </div>
                <div class="grid grid-cols-1 gap-4 md:grid-cols-2">${criteriaHtml}</div>
              </section>

              <div class="mt-8 flex flex-wrap items-center justify-between gap-4 border-t border-slate-200 pt-6">
                <button
                  type="button"
                  data-action="restart-scenario"
                  class="inline-flex h-12 items-center gap-2 rounded-xl border border-slate-300 bg-white px-5 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-50 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]"
                >
                  ${svgIcon('rotateCcw', 'h-4 w-4')}
                  <span>Пройти сценарий заново</span>
                </button>

                <button
                  type="button"
                  data-action="go-home"
                  class="inline-flex h-12 items-center gap-2 rounded-xl bg-[#1B3A6B] px-7 text-sm sm:text-base font-bold text-white shadow-sm transition-all duration-150 hover:-translate-y-0.5 hover:bg-[#142C52] hover:shadow-md cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] focus-visible:ring-offset-2"
                >
                  ${svgIcon('arrowLeft', 'h-4 w-4')}
                  <span>К другим примерам</span>
                </button>
              </div>
            </main>
          `;
        }

        function animateEvaluationScreen() {
          const scenario = getActiveScenario();
          const target = scenario.evaluation.final_result.overall_score;
          const scoreEl = document.getElementById('eval-overall-score');

          const prefersReducedMotion =
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          window.requestAnimationFrame(function () {
            document.querySelectorAll('[data-eval-bar-pct]').forEach(function (el) {
              el.style.width = el.getAttribute('data-eval-bar-pct') + '%';
            });
          });

          if (!scoreEl) return;
          if (prefersReducedMotion) {
            scoreEl.textContent = target.toFixed(1);
            return;
          }

          const duration = 900;
          const startTime = performance.now();

          function tick(now) {
            const progress = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - progress, 3);
            scoreEl.textContent = (target * eased).toFixed(1);
            if (progress < 1) {
              evalFrameId = window.requestAnimationFrame(tick);
            } else {
              scoreEl.textContent = target.toFixed(1);
            }
          }

          evalFrameId = window.requestAnimationFrame(tick);
        }

        // ========================================================
        // SCENARIO RUNTIME ENGINE
        // ========================================================

        function triggerFieldHighlights(nextProfile) {
          const prev = state.prevProfile || {};
          const changed = new Set();
          Object.keys(nextProfile).forEach(function (k) {
            if (prev[k] !== nextProfile[k]) {
              changed.add(k);
            }
          });
          state.prevProfile = nextProfile;

          if (changed.size > 0) {
            state.highlightedFields = changed;
            const t = window.setTimeout(function () {
              state.highlightedFields = new Set();
              if (state.activeScreen === 'scenario') {
                const inspectorEl = document.getElementById('agents-inspector-slot');
                if (inspectorEl) inspectorEl.innerHTML = renderAgentsInspectorHtml();
              }
            }, 1600);
            pendingTimers.push(t);
          }
        }

        function runThinkingSequence(fastInitial, onComplete) {
          pendingTimers.forEach(function (id) {
            window.clearTimeout(id);
          });
          pendingTimers = [];

          const d = fastInitial ? 320 : 550;
          const typingD = fastInitial ? 420 : 550;

          state.thinkingPhase = 'profiler';
          updateScenarioRegions({ updateReplyDock: true });

          const t1 = window.setTimeout(function () {
            state.thinkingPhase = 'router';
            updateScenarioRegions({ updateReplyDock: false });
          }, d);

          const t2 = window.setTimeout(function () {
            state.thinkingPhase = 'final_agent';
            updateScenarioRegions({ updateReplyDock: false });
          }, d * 2);

          const t3 = window.setTimeout(function () {
            state.thinkingPhase = 'typing';
            updateScenarioRegions({ updateReplyDock: false });
          }, d * 3);

          const t4 = window.setTimeout(function () {
            const msg = onComplete();
            state.thinkingPhase = 'idle';
            if (state.soundEnabled) {
              playSupportPing();
            }
            updateScenarioRegions({ appendMessage: msg, updateReplyDock: true });
            scheduleAutoDemoIfActive();
          }, d * 3 + typingD);

          pendingTimers.push(t1, t2, t3, t4);
        }

        function scheduleAutoDemoIfActive() {
          if (autoDemoTimer) {
            window.clearTimeout(autoDemoTimer);
            autoDemoTimer = null;
          }
          if (
            state.activeScreen !== 'scenario' ||
            !state.isAutoDemo ||
            state.thinkingPhase !== 'idle' ||
            state.isDialogueFinished
          ) {
            return;
          }

          const scenario = getActiveScenario();
          const currentStep = scenario.steps[state.stepIndex];
          const mainOption =
            currentStep.client_options.find(function (opt) {
              return opt.is_main && state.usedAltIds.indexOf(opt.id) === -1;
            }) || currentStep.client_options[0];

          if (!mainOption) return;

          autoDemoTimer = window.setTimeout(function () {
            executeReplyOption(mainOption, true);
          }, 2400);
        }

        function executeReplyOption(option, fromAutoDemo) {
          if (state.thinkingPhase !== 'idle' || state.isDialogueFinished) return;
          dismissCoachmark();
          if (!fromAutoDemo) {
            state.isAutoDemo = false;
            if (autoDemoTimer) {
              window.clearTimeout(autoDemoTimer);
              autoDemoTimer = null;
            }
          }

          const scenario = getActiveScenario();
          const currentStep = scenario.steps[state.stepIndex];

          const displayText =
            option.is_main && state.hasUsedBranchOnStep && option.after_branch_text
              ? option.after_branch_text
              : option.text;

          const clientMsg = {
            id: scenario.id + '-client-' + Date.now() + '-' + option.id,
            role: 'client',
            text: displayText,
            isBranch: !option.is_main,
          };
          state.messages.push(clientMsg);
          updateScenarioRegions({ appendMessage: clientMsg, updateReplyDock: false });

          if (!option.is_main && option.branch) {
            state.usedAltIds.push(option.id);
            state.totalAltUsedIds.add(option.id);
            state.hasUsedBranchOnStep = true;

            const updatedProfile = Object.assign(
              {},
              state.displayedReasoning.profile,
              option.branch.profile_patch
            );
            const updatedReasoning = {
              profile: updatedProfile,
              router: Object.assign({}, state.displayedReasoning.router, {
                reason: option.branch.router_reason || state.displayedReasoning.router.reason,
              }),
              final_agent: Object.assign({}, state.displayedReasoning.final_agent, {
                goal: option.branch.final_agent_goal || state.displayedReasoning.final_agent.goal,
              }),
            };

            const replyText = option.branch.support_reply;
            state.displayedReasoning = updatedReasoning;
            state.activeSupportAnswer = replyText;
            triggerFieldHighlights(updatedProfile);

            runThinkingSequence(false, function () {
              const supportMsg = {
                id: scenario.id + '-branch-support-' + Date.now(),
                role: 'support',
                step: currentStep.step,
                agentLabel: updatedReasoning.router.selected_agent,
                text: replyText,
              };
              state.messages.push(supportMsg);
              return supportMsg;
            });
            return;
          }

          if (state.stepIndex < scenario.steps.length - 1) {
            state.stepIndex += 1;
            const nextStep = scenario.steps[state.stepIndex];
            state.usedAltIds = [];
            state.hasUsedBranchOnStep = false;
            state.displayedReasoning = nextStep.support.reasoning;
            state.activeSupportAnswer = nextStep.support.answer;
            triggerFieldHighlights(nextStep.support.reasoning.profile);

            runThinkingSequence(false, function () {
              const supportMsg = {
                id: scenario.id + '-step-' + nextStep.step + '-support-' + Date.now(),
                role: 'support',
                step: nextStep.step,
                agentLabel: nextStep.support.reasoning.router.selected_agent,
                text: nextStep.support.answer,
              };
              state.messages.push(supportMsg);
              return supportMsg;
            });
          } else {
            state.isAutoDemo = false;
            state.isDialogueFinished = true;
            updateScenarioRegions({ updateReplyDock: true });
          }
        }

        function startScenarioSession(scenarioId) {
          clearAllTimers();
          dismissCoachmark();

          if (scenarioId) {
            state.activeScenarioId = scenarioId;
          }
          const scenario = getActiveScenario();
          const firstStep = scenario.steps[0];

          state.activeScreen = 'scenario';
          state.mobileTab = 'chat';
          state.stepIndex = 0;
          state.messages = [];
          state.usedAltIds = [];
          state.totalAltUsedIds = new Set();
          state.hasUsedBranchOnStep = false;
          state.isDialogueFinished = false;
          state.isDetailsExpanded = false;
          state.isAutoDemo = false;
          state.displayedReasoning = firstStep.support.reasoning;
          state.activeSupportAnswer = firstStep.support.answer;
          state.prevProfile = firstStep.support.reasoning.profile;
          state.highlightedFields = new Set();
          state.thinkingPhase = 'profiler';

          renderApp();
          scrollToTop();

          runThinkingSequence(true, function () {
            const msg = {
              id: scenario.id + '-step-1-support',
              role: 'support',
              step: 1,
              agentLabel: firstStep.support.reasoning.router.selected_agent,
              text: firstStep.support.answer,
            };
            state.messages.push(msg);
            return msg;
          });
        }

        function buildExportHistory() {
          const history = [];
          let currentStepNum = 1;
          state.messages.forEach(function (m) {
            if (m.role === 'support') {
              currentStepNum = m.step;
              history.push({
                step: m.step,
                role: 'support',
                agent: m.agentLabel,
                text: m.text,
              });
            } else if (m.role === 'client') {
              history.push({
                step: currentStepNum,
                role: 'client',
                text: m.text,
                is_alternative_branch: Boolean(m.isBranch),
              });
            }
          });
          return history;
        }

        function openEvaluationScreen() {
          clearAllTimers();
          dismissCoachmark();
          state.lastAltBranchesUsed = state.totalAltUsedIds.size;
          state.lastPlayedHistory = buildExportHistory();
          state.activeScreen = 'evaluation';
          renderApp();
          scrollToTop();
          animateEvaluationScreen();
        }

        function downloadDialogueJson() {
          const scenario = getActiveScenario();
          const altBranchesTotal = scenario.steps.reduce(function (sum, s) {
            return (
              sum +
              s.client_options.filter(function (o) {
                return !o.is_main;
              }).length
            );
          }, 0);

          const payload = {
            exported_at: new Date().toISOString(),
            stand: 'STIMIT Multi-Agent Support Demo',
            scenario: {
              id: scenario.id,
              title: scenario.title,
              industry: scenario.industry,
              client_type: scenario.clientType,
              context: scenario.shortContext,
            },
            session_stats: {
              alternative_replies_used: state.lastAltBranchesUsed,
              alternative_replies_total: altBranchesTotal,
            },
            played_dialogue_history: state.lastPlayedHistory,
            scenario_steps_reasoning: scenario.steps.map(function (s) {
              return {
                step: s.step,
                support: s.support,
                client_response: s.client_response,
              };
            }),
            evaluation: scenario.evaluation,
          };

          const blob = new Blob([JSON.stringify(payload, null, 2)], {
            type: 'application/json;charset=utf-8',
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'stimit-dialogue-' + scenario.id + '.json';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        }

        // ========================================================
        // ROOT RENDERER & EVENT DELEGATION
        // ========================================================

        function renderApp() {
          const root = document.getElementById('app');
          if (!root) return;

          let contentHtml = '';
          if (state.activeScreen === 'home') {
            contentHtml = renderHomeView();
          } else if (state.activeScreen === 'scenario') {
            contentHtml = renderScenarioViewShell();
          } else {
            contentHtml = renderEvaluationView();
          }

          root.innerHTML =
            renderTopBar() +
            `<div class="flex-1">${contentHtml}</div>` +
            renderFooter() +
            `<div id="coachmark-root">${renderCoachmarkHtml()}</div>` +
            `<div id="guide-modal-root">${renderGuideModalHtml()}</div>`;

          if (state.activeScreen === 'scenario' && state.messages.length > 0) {
            const listEl = document.getElementById('chat-messages-list');
            if (listEl) {
              listEl.innerHTML = state.messages.map(renderSingleMessageHtml).join('');
            }
          }
        }

        const appRoot = document.getElementById('app');

        appRoot.addEventListener('click', function (e) {
          const target = e.target;
          if (!target) return;

          const actionEl = target.closest('[data-action]');
          if (!actionEl) return;

          const action = actionEl.getAttribute('data-action');

          if (action === 'close-guide-backdrop') {
            if (target.closest('[data-stop-propagation="true"]')) return;
            state.isGuideOpen = false;
            const modalRoot = document.getElementById('guide-modal-root');
            if (modalRoot) modalRoot.innerHTML = '';
            return;
          }

          if (action === 'open-guide') {
            dismissCoachmark();
            state.isGuideOpen = true;
            const modalRoot = document.getElementById('guide-modal-root');
            if (modalRoot) modalRoot.innerHTML = renderGuideModalHtml();
            return;
          }

          if (action === 'close-guide') {
            state.isGuideOpen = false;
            const modalRoot = document.getElementById('guide-modal-root');
            if (modalRoot) modalRoot.innerHTML = '';
            return;
          }

          if (action === 'dismiss-coachmark') {
            dismissCoachmark();
            return;
          }

          if (action === 'toggle-sound') {
            state.soundEnabled = !state.soundEnabled;
            if (state.soundEnabled) playSupportPing();
            // Re-render topbar cleanly
            const header = appRoot.querySelector('header');
            if (header) header.outerHTML = renderTopBar();
            return;
          }

          if (action === 'go-home') {
            clearAllTimers();
            dismissCoachmark();
            state.isAutoDemo = false;
            state.activeScreen = 'home';
            renderApp();
            scrollToTop();
            return;
          }

          if (action === 'start-first-example') {
            startScenarioSession(SCENARIOS[0].id);
            return;
          }

          if (action === 'select-scenario') {
            const id = actionEl.getAttribute('data-scenario-id');
            startScenarioSession(id);
            return;
          }

          if (action === 'restart-scenario') {
            startScenarioSession(state.activeScenarioId);
            return;
          }

          if (action === 'toggle-autodemo') {
            dismissCoachmark();
            state.isAutoDemo = !state.isAutoDemo;
            const controlsEl = document.getElementById('scenario-controls-bar');
            if (controlsEl) controlsEl.innerHTML = renderScenarioControlsBarHtml();
            const headerEl = document.getElementById('chat-header-box');
            if (headerEl) headerEl.innerHTML = renderChatHeaderHtml();
            if (state.isAutoDemo) {
              scheduleAutoDemoIfActive();
            } else if (autoDemoTimer) {
              window.clearTimeout(autoDemoTimer);
              autoDemoTimer = null;
            }
            return;
          }

          if (action === 'set-mobile-tab') {
            const tab = actionEl.getAttribute('data-tab');
            state.mobileTab = tab;
            const chatCol = document.getElementById('scenario-chat-col');
            const agentsCol = document.getElementById('scenario-agents-col');
            if (chatCol && agentsCol) {
              chatCol.className =
                'flex flex-col rounded-2xl border border-slate-200 bg-white shadow-sm lg:col-span-6 lg:h-[calc(100vh-11.5rem)] lg:min-h-[580px] lg:max-h-[760px] ' +
                (tab === 'chat' ? 'flex' : 'hidden lg:flex');
              agentsCol.className =
                'space-y-4 lg:col-span-6 ' + (tab === 'agents' ? 'block' : 'hidden lg:block');
            }
            const tabsBar = document.getElementById('mobile-tabs-bar');
            if (tabsBar) {
              tabsBar.querySelectorAll('[data-action="set-mobile-tab"]').forEach(function (btn) {
                const isSel = btn.getAttribute('data-tab') === tab;
                btn.setAttribute('aria-selected', String(isSel));
                btn.className =
                  'flex-1 rounded-lg py-2 text-sm font-semibold transition-colors cursor-pointer ' +
                  (isSel
                    ? 'bg-white text-[#1B3A6B] shadow-xs'
                    : 'text-slate-600 hover:text-slate-900');
              });
            }
            return;
          }

          if (action === 'set-panel-view') {
            state.panelView = actionEl.getAttribute('data-view');
            const inspectorEl = document.getElementById('agents-inspector-slot');
            if (inspectorEl) inspectorEl.innerHTML = renderAgentsInspectorHtml();
            return;
          }

          if (action === 'toggle-details') {
            dismissCoachmark();
            state.isDetailsExpanded = !state.isDetailsExpanded;
            const inspectorEl = document.getElementById('agents-inspector-slot');
            if (inspectorEl) inspectorEl.innerHTML = renderAgentsInspectorHtml();
            return;
          }

          if (action === 'choose-reply') {
            const optId = actionEl.getAttribute('data-option-id');
            const scenario = getActiveScenario();
            const currentStep = scenario.steps[state.stepIndex];
            const opt = currentStep.client_options.find(function (o) {
              return o.id === optId;
            });
            if (opt) executeReplyOption(opt, false);
            return;
          }

          if (action === 'open-evaluation') {
            openEvaluationScreen();
            return;
          }

          if (action === 'download-json') {
            downloadDialogueJson();
          }
        });

        appRoot.addEventListener('submit', function (e) {
          if (e.target && e.target.id === 'demo-custom-form') {
            e.preventDefault();
            const input = document.getElementById('demo-chat-input');
            if (!input) return;
            const trimmed = input.value.trim();
            if (!trimmed) return;

            dismissCoachmark();
            state.isAutoDemo = false;
            if (autoDemoTimer) {
              window.clearTimeout(autoDemoTimer);
              autoDemoTimer = null;
            }

            const noticeMsg = {
              id: 'custom-' + Date.now(),
              role: 'demo_notice',
              userText: trimmed,
              noticeText: DEMO_FALLBACK_MESSAGE,
            };
            state.messages.push(noticeMsg);
            input.value = '';
            updateScenarioRegions({ appendMessage: noticeMsg, updateReplyDock: false });
          }
        });

        window.addEventListener('keydown', function (e) {
          if (state.isGuideOpen) {
            if (e.key === 'Escape') {
              state.isGuideOpen = false;
              const modalRoot = document.getElementById('guide-modal-root');
              if (modalRoot) modalRoot.innerHTML = '';
            }
            return;
          }

          const target = e.target;
          const tagName = target && target.tagName ? target.tagName.toLowerCase() : '';
          if (tagName === 'input' || tagName === 'textarea' || tagName === 'select') {
            return;
          }

          if (state.activeScreen === 'home') {
            if (e.key === 'Enter' && tagName !== 'button' && tagName !== 'a') {
              e.preventDefault();
              startScenarioSession(SCENARIOS[0].id);
            }
            return;
          }

          if (state.activeScreen === 'evaluation') {
            if (e.key === 'Enter' && tagName !== 'button' && tagName !== 'a') {
              e.preventDefault();
              clearAllTimers();
              state.activeScreen = 'home';
              renderApp();
              scrollToTop();
            }
            return;
          }

          if (state.activeScreen === 'scenario') {
            const scenario = getActiveScenario();
            const currentStep = scenario.steps[state.stepIndex];
            const availableOptions = currentStep.client_options.filter(function (opt) {
              return state.usedAltIds.indexOf(opt.id) === -1;
            });

            if (e.key === '1' || e.key === '2' || e.key === '3') {
              if (state.thinkingPhase !== 'idle' || state.isDialogueFinished) return;
              const chosen = availableOptions[Number(e.key) - 1];
              if (chosen) {
                e.preventDefault();
                executeReplyOption(chosen, false);
              }
              return;
            }

            if (e.key === 'Enter' && tagName !== 'button' && tagName !== 'a') {
              if (state.isDialogueFinished) {
                e.preventDefault();
                openEvaluationScreen();
              } else if (state.thinkingPhase === 'idle' && availableOptions.length > 0) {
                const primary =
                  availableOptions.find(function (o) {
                    return o.is_main;
                  }) || availableOptions[0];
                if (primary) {
                  e.preventDefault();
                  executeReplyOption(primary, false);
                }
              }
            }
          }
        });

        // Initial boot
        renderApp();
      })();
    </script>
  </body>
